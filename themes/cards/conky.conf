-- living-sky · cards theme (solid Catppuccin cards)
-- Full-screen transparent click-through canvas; cards drawn in cards.lua.
conky.config = {
    lua_load = '@ROOT@/themes/cards/cards.lua',     -- @ROOT@ is filled in by bin/living-sky
    lua_draw_hook_pre = 'living_sky_main',

    own_window = true,
    own_window_type = 'dock',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_color = '#00000000',                 -- fully transparent (ARGB is always on in conky 1.26+)
    own_window_class = 'Conky',
    own_window_title = 'living-sky-cards',

    alignment = 'top_left',
    gap_x = @X@, gap_y = @Y@,                -- primary monitor position / size, filled in by bin/living-sky
    minimum_width = @W@, maximum_width = @W@, minimum_height = @H@,
    border_inner_margin = 0, border_outer_margin = 0, border_width = 0,

    double_buffer = true,
    draw_shades = false, draw_outline = false, draw_borders = false, draw_graph_borders = false,
    use_xft = true, font = 'JetBrains Mono:size=8', override_utf8_locale = true,

    update_interval = 0.25,
    cpu_avg_samples = 2, net_avg_samples = 2, no_buffers = true,
}
conky.text = [[ ]]
